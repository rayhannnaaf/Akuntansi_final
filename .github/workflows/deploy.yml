name: Deploy to VPS

on:
    push:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ghcr.io/${{ github.repository_owner }}/akuntansi-final:latest
                  build-args: |
                      DATABASE_URL=${{ secrets.DATABASE_URL }}

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  command_timeout: 10m
                  script: |
                      REPO_DIR=/root/akuntansi_final
                      if [ ! -d "$REPO_DIR" ]; then
                        git clone https://github.com/rayhannnaaf/Akuntansi_final.git $REPO_DIR
                      fi
                      cd $REPO_DIR
                      git pull origin main

                      cat > .env.production <<'ENVEOF'
                      NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                      NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
                      SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                      DATABASE_URL=${{ secrets.DATABASE_URL }}
                      ENVEOF

                      echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
                      docker pull ghcr.io/${{ github.repository_owner }}/akuntansi-final:latest
                      docker-compose down
                      docker-compose up -d